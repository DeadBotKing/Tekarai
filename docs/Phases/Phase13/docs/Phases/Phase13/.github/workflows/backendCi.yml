# ============================================================================
# Tekarai — Backend Continuous Integration (Phase 01 · CI foundation)
# Runs the full quality gate on Linux and Windows (commands must stay
# Windows-compatible per docs/Phases/Phase1.md §21).
# ============================================================================
name: backendCi

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backendCi.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backendCi.yml"]

jobs:
  qualityGate:
    name: Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt

      - name: Django system check
        run: python manage.py check --settings=config.settings.testing

      - name: Migration state check
        run: python manage.py makemigrations --check --settings=config.settings.testing

      - name: Tests
        run: python manage.py test --settings=config.settings.testing

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy config apps tests
