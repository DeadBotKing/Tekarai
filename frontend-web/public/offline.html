<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>تکارای — بدون اتصال</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e2e8f0;
        font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #94a3b8; line-height: 2; margin: 0 0 20px; }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
      }
      svg { width: 72px; height: 72px; color: #2563eb; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M3 3l18 18" />
        <path d="M6.5 11.5a7 7 0 0 1 4-2.4" />
        <path d="M3.5 8.5a11 11 0 0 1 4-2.6" />
        <path d="M17.5 11.5a7 7 0 0 0-2.2-1.6" />
        <path d="M20.5 8.5a11 11 0 0 0-4.4-2.7" />
        <path d="M9.5 14.5a3.5 3.5 0 0 1 5 0" />
        <circle cx="12" cy="18.5" r="0.6" fill="currentColor" />
      </svg>
      <h1>اتصالی در دسترس نیست</h1>
      <p>
        این صفحه هنوز روی دستگاه ذخیره نشده است. کارهایی که ثبت کرده‌اید در صف
        دستگاه محفوظ است و به‌محض بازگشت اینترنت ارسال می‌شود.
      </p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
